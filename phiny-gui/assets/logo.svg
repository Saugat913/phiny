<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left phone (slightly tilted) -->
  <g transform="translate(55, 85) rotate(-15)">
    <rect x="0" y="0" width="28" height="45" rx="4" fill="none" stroke="url(#blueGradient)" stroke-width="3.5"/>
    <line x1="6" y1="38" x2="22" y2="38" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Right phone (opposite tilt) -->
  <g transform="translate(117, 90) rotate(12)">
    <rect x="0" y="0" width="28" height="45" rx="4" fill="none" stroke="url(#blueGradient)" stroke-width="3.5"/>
    <line x1="6" y1="38" x2="22" y2="38" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Sound waves connecting them (asymmetric curves) -->
  <path d="M 75 100 Q 90 85, 100 95" 
        fill="none" 
        stroke="#4FC3F7" 
        stroke-width="2.5" 
        stroke-linecap="round"
        opacity="0.8"/>
  
  <path d="M 100 95 Q 110 105, 125 105" 
        fill="none" 
        stroke="#29B6F6" 
        stroke-width="2.5" 
        stroke-linecap="round"
        opacity="0.8"/>
  
  <path d="M 78 110 Q 95 115, 110 100" 
        fill="none" 
        stroke="#4FC3F7" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  

</svg>