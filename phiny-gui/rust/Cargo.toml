[package]
name = "rust_lib_phiny_gui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.100"
bincode = "2.0.1"
env_logger.workspace = true
flutter_rust_bridge = "=2.11.1"
log.workspace = true
phiny-core={version="0.1.0",path="../../phiny-core"}
tokio = { version = "1.48.0", features = ["full"] }



[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
